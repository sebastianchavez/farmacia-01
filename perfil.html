<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · FarmaSalud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./assets/css/tailwind.config.js"></script>
  <link rel="stylesheet" href="./assets/css/styles.css" />
<meta name="currency" content="CLP">
</head>
<body class="min-h-screen flex flex-col">

  <div data-header></div>

  <main class="flex-1">

    <div id="sin-sesion" class="hidden max-w-md mx-auto px-4 py-16 text-center">
      <h2 class="font-display text-2xl text-primary-900">Inicia sesión para ver tu perfil</h2>
      <a href="login.html?redirect=perfil.html" class="btn-primary mt-6">Iniciar sesión</a>
    </div>

    <div id="perfil" class="hidden">
      <section class="bg-gradient-to-br from-primary-50 to-white">
        <div class="max-w-7xl mx-auto px-4 py-10 reveal flex items-center gap-5">
          <div class="w-16 h-16 rounded-full bg-primary text-white grid place-items-center text-2xl font-bold" id="avatar"></div>
          <div>
            <p class="text-xs uppercase tracking-[0.3em] text-primary font-semibold">Mi cuenta</p>
            <h1 class="mt-1 font-display text-3xl text-primary-900" id="nombre-header"></h1>
            <p class="text-sm text-muted">Cliente desde <span id="fecha-reg"></span></p>
          </div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4 py-10 grid lg:grid-cols-[320px_1fr] gap-8">

        <aside class="space-y-3">
          <div class="bg-white border border-primary-100 rounded-2xl p-5">
            <h2 class="font-display text-lg text-primary-900">Datos personales</h2>
            <form id="perfil-form" class="mt-4 space-y-3">
              <div>
                <label class="text-xs uppercase tracking-wider text-muted font-semibold">Nombre</label>
                <input name="nombre" required class="input-field mt-1" />
              </div>
              <div>
                <label class="text-xs uppercase tracking-wider text-muted font-semibold">Teléfono</label>
                <input name="telefono" type="tel" class="input-field mt-1" />
              </div>
              <div>
                <label class="text-xs uppercase tracking-wider text-muted font-semibold">Dirección</label>
                <input name="direccion" class="input-field mt-1" />
              </div>
              <div>
                <label class="text-xs uppercase tracking-wider text-muted font-semibold">Correo</label>
                <input name="email" disabled class="input-field mt-1 bg-primary-50 cursor-not-allowed" />
              </div>
              <button type="submit" class="btn-primary w-full">Guardar cambios</button>
            </form>
            <button id="logout" class="mt-3 text-xs text-red-600 hover:underline w-full text-center">Cerrar sesión</button>
          </div>
        </aside>

        <div>
          <div class="flex items-center justify-between mb-5">
            <h2 class="font-display text-2xl text-primary-900">Historial de pedidos</h2>
            <span id="total-pedidos" class="text-sm text-muted"></span>
          </div>
          <div id="pedidos-list" class="space-y-3"></div>
          <div id="sin-pedidos" class="hidden bg-white border border-primary-100 rounded-2xl p-10 text-center">
            <span class="material-symbols-outlined text-5xl text-muted">inventory_2</span>
            <p class="mt-3 font-display text-lg text-primary-900">Aún no tienes pedidos</p>
            <a href="productos.html" class="btn-primary mt-4">Explorar productos</a>
          </div>
        </div>

      </section>
    </div>

  </main>

  <div data-footer></div>

  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/main.js"></script>
  <script>
    const sesion = obtenerSesion();
    if (!sesion) {
      document.getElementById("sin-sesion").classList.remove("hidden");
    } else {
      document.getElementById("perfil").classList.remove("hidden");
      const usuarios = obtenerUsuarios();
      const u = usuarios.find(x => x.id === sesion.id);

      document.getElementById("avatar").textContent = (u.nombre || "U").split(" ").map(n => n[0]).join("").slice(0,2);
      document.getElementById("nombre-header").textContent = u.nombre;
      document.getElementById("fecha-reg").textContent = formatearFecha(u.fechaRegistro);

      const form = document.getElementById("perfil-form");
      form.nombre.value = u.nombre || "";
      form.telefono.value = u.telefono || "";
      form.direccion.value = u.direccion || "";
      form.email.value = u.email || "";

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const res = actualizarPerfil({
          nombre: fd.get("nombre").trim(),
          telefono: fd.get("telefono").trim(),
          direccion: fd.get("direccion").trim(),
        });
        if (res.ok) {
          toast("Datos actualizados", "success");
          document.getElementById("nombre-header").textContent = fd.get("nombre").trim();
          document.getElementById("avatar").textContent = fd.get("nombre").trim().split(" ").map(n=>n[0]).join("").slice(0,2);
        }
      });

      document.getElementById("logout").addEventListener("click", () => cerrarSesionYRedirigir("index.html"));

      // Pedidos
      const pedidos = obtenerPedidos()
        .filter(p => p.usuarioEmail === sesion.email)
        .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

      document.getElementById("total-pedidos").textContent = `${pedidos.length} pedido${pedidos.length !== 1 ? "s" : ""}`;

      if (!pedidos.length) {
        document.getElementById("sin-pedidos").classList.remove("hidden");
      } else {
        const estadoColor = {
          "Procesando": "bg-amber-100 text-amber-700",
          "En camino": "bg-blue-100 text-blue-700",
          "Entregado": "bg-accent/20 text-accent-dark",
          "Cancelado": "bg-red-100 text-red-700",
        };
        document.getElementById("pedidos-list").innerHTML = pedidos.map(p => `
          <a href="pedido.html?id=${p.id}" class="block bg-white border border-primary-100 rounded-2xl p-5 hover:shadow-soft transition reveal">
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-primary-900">${p.id}</p>
                <p class="text-xs text-muted">${formatearFecha(p.fecha)} · ${p.productos.length} producto${p.productos.length !== 1 ? "s" : ""}</p>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${estadoColor[p.estado] || "bg-primary-100 text-primary"}">${p.estado}</span>
              <span class="font-bold text-primary text-lg">${formatearPrecio(p.total)}</span>
              <span class="material-symbols-outlined text-muted">chevron_right</span>
            </div>
            <div class="mt-3 flex gap-2 overflow-x-auto">
              ${p.productos.slice(0, 4).map(it => `
                <div class="w-12 h-12 rounded-lg overflow-hidden bg-primary-50 flex-shrink-0">
                  <img src="${it.imagen}" alt="" class="w-full h-full object-cover" />
                </div>
              `).join("")}
              ${p.productos.length > 4 ? `<div class="w-12 h-12 rounded-lg bg-primary-100 text-primary grid place-items-center text-xs font-semibold">+${p.productos.length - 4}</div>` : ""}
            </div>
          </a>
        `).join("");
      }
    }
  </script>
</body>
</html>
